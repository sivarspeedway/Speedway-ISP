<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030b19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SPEEDWAY"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>SPEEDWAY Co.</title><style>
*{box-sizing:border-box}html{background:#030b19}body{margin:0;min-height:100dvh;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 75% 8%,#06457b80 0,transparent 37%),radial-gradient(ellipse at 10% 90%,#063a7470 0,transparent 40%),linear-gradient(160deg,#020714,#06142b 53%,#020611);overflow-x:hidden}.page{width:min(530px,100%);min-height:100dvh;margin:auto;padding:42px 22px 42px;position:relative;isolation:isolate;text-align:center;display:flex;flex-direction:column;justify-content:center}.page:before{content:"";position:absolute;z-index:-1;top:4%;right:-35%;width:105%;aspect-ratio:1;border:1px solid #079fff65;border-radius:50%;box-shadow:0 0 50px #0076ff38,inset 0 0 65px #006eff25;transform:rotate(-25deg)}.page:after{content:"";position:absolute;z-index:-1;bottom:-19%;left:-30%;width:135%;height:34%;border-top:2px solid #ff9a06;border-radius:50%;box-shadow:0 -12px 40px #ff8a0030,0 -35px 80px #008cff24;transform:rotate(8deg)}.logo{width:min(390px,96%);height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 8px 20px #000b)}.brand h1{direction:ltr;font-size:clamp(23px,6vw,33px);margin:0;font-weight:800;letter-spacing:.4px}.brand .sub{direction:ltr;font-size:clamp(12px,3.4vw,16px);color:#c4d2e4;margin:4px 0 38px}.brand h1:before,.brand h1:after{content:"";display:inline-block;width:24px;height:2px;background:linear-gradient(90deg,#fbbf24,#ff7900);vertical-align:middle;margin:0 10px}.entry{margin:0 0 24px}.link-card{direction:ltr;display:flex;align-items:center;gap:14px;text-decoration:none;color:white;border-radius:22px;min-height:112px;padding:17px 18px;position:relative;overflow:hidden;transition:transform .15s,filter .15s}.link-card:active{transform:scale(.98)}.link-card:focus-visible{outline:3px solid white;outline-offset:4px}.link-card.admin{background:linear-gradient(145deg,#057bfa,#073d9a 58%,#061c51);border:2px solid #23c6ff;box-shadow:inset 0 1px 14px #8cdcff45,0 0 16px #008cff9c,0 14px 24px #0009}.link-card.customer{background:linear-gradient(145deg,#ffae05,#b94b00 55%,#6b2100);border:2px solid #ffce42;box-shadow:inset 0 1px 15px #fff0a34d,0 0 16px #ff8c0080,0 14px 24px #0009}.symbol{display:flex;align-items:center;justify-content:center;width:70px;flex:0 0 70px;font-size:42px;line-height:1;border-right:1px solid #ffffff70;padding-right:14px}.card-copy{flex:1;min-width:0;text-align:left}.card-copy strong{display:block;font-size:clamp(26px,7vw,37px);line-height:1.2}.card-copy small{display:block;direction:rtl;text-align:left;font-size:clamp(11px,3vw,14px);font-weight:500;line-height:1.7;margin-top:7px}.arrow{font-size:29px;border:1px solid #ffffffa0;width:36px;height:36px;line-height:30px;border-radius:50%;flex:0 0 36px}.phone{direction:ltr;align-self:center;display:flex;align-items:center;gap:13px;margin-top:24px;border:1.5px solid #ff9d12;border-radius:50px;padding:13px 23px;background:#020713c9;box-shadow:0 0 18px #ff8a0025;font-size:clamp(20px,5vw,27px);font-weight:750;letter-spacing:1px;white-space:nowrap}.phone .phone-icon{font-size:22px;color:#ffab21}.fine{margin-top:16px;color:#6c9ac1;font-size:11px;letter-spacing:2px;direction:ltr}@media(max-width:380px){.page{padding:25px 15px}.symbol{width:53px;flex-basis:53px;font-size:30px;padding-right:9px}.symbol svg{width:37px;height:37px}.link-card{gap:9px;padding:12px;min-height:105px}.arrow{width:29px;height:29px;flex-basis:29px;line-height:24px;font-size:22px}.brand .sub{margin-bottom:29px}}
 .viewer{display:none;position:fixed;inset:0;z-index:20;background:#030b19;flex-direction:column}.viewer.active{display:flex}.viewer-bar{display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:12px 16px;background:#081a34;border-bottom:1px solid #1675b7}.viewer-bar button,.viewer-bar a{border:1px solid #37a8f6;border-radius:12px;padding:10px 14px;background:#102c50;color:white;font:inherit;text-decoration:none}.viewer iframe{flex:1;width:100%;border:0;background:white}.viewer-note{padding:6px 12px;color:#b6cce4;font-size:12px;background:#081a34} </style></head><body><main class="page"><header class="brand"><img class="logo" src="./speedway-logo.png" alt="SPEEDWAY"><h1>SPEEDWAY Co.</h1><p class="sub">IT &amp; Communications and ISP Ltd.</p></header><section class="entry"><a class="link-card admin" id="admin" href="https://sas.speedline-iq.com" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 64 64" width="52" height="52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="32" cy="17" r="10" fill="white"/><path d="M13 52c0-12 8-19 19-19s19 7 19 19v3H13z" fill="white"/><path d="m28 35 4 5 4-5-2 13-2 4-2-4z" fill="#1261c9"/></svg></span><span class="card-copy"><strong>Admin</strong><small>بۆ بریکارەکانمان کرتە لەسەر Admin بکە</small></span><span class="arrow" aria-hidden="true">›</span></a></section><section class="entry"><a class="link-card customer" id="customer" href="https://speedline-iq.com" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 64 64" width="52" height="52" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="25" cy="20" r="10"/><circle cx="47" cy="24" r="7" opacity=".82"/><path d="M5 52c0-12 8-19 20-19s20 7 20 19v4H5z"/><path d="M44 37c9 0 15 6 15 15v4H48v-4c0-6-1-11-4-15z" opacity=".82"/></svg></span><span class="card-copy"><strong>Customer</strong><small>بۆ زانیاری دەربارەی هێڵەکەت یان پڕکردنەوەی هێڵەکەت کرتە لەسەر Customer بکە</small></span><span class="arrow" aria-hidden="true">›</span></a></section><footer class="phone"><span class="phone-icon" aria-hidden="true">☎</span><span>0750 857 2587</span></footer><div class="fine">SPEEDWAY ISP</div></main><section id="viewer" class="viewer" aria-label="System view"><div class="viewer-bar"><button id="back" type="button">سەرەکی Main</button><strong id="viewer-title">System</strong></div><iframe id="system-frame" title="SPEEDWAY system" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe></section><script>
async function loadLinks(){try{const r=await fetch('./links.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Network error');const j=await r.json();for(const key of ['admin','customer']){const value=j[key]||(key==='customer'?j.user:null);if(!value)continue;const url=new URL(value);if(url.protocol!=='https:')continue;document.getElementById(key).href=url.href}}catch(e){console.warn('Default links used',e)}}loadLinks();
const viewer=document.getElementById('viewer'),frame=document.getElementById('system-frame');
for(const key of ['admin','customer']){const a=document.getElementById(key);a.removeAttribute('target');a.addEventListener('click',e=>{e.preventDefault();document.getElementById('viewer-title').textContent=key==='admin'?'Admin':'Customer';frame.src=a.href;viewer.classList.add('active');history.replaceState({viewer:true},'',location.pathname+location.search+'#'+key)})}
function closeViewer(){viewer.classList.remove('active');frame.src='about:blank'}
document.getElementById('back').addEventListener('click',()=>{closeViewer();history.replaceState(null,'',location.pathname+location.search);});window.addEventListener('popstate',()=>closeViewer());
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
