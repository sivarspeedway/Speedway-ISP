<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Speedline"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Speedline</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101827;color:#fff;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center}.app{width:min(420px,100%);padding:32px 24px;text-align:center}.logo{width:82px;height:82px;margin:auto auto 16px;border-radius:22px;background:#1d2a3d;display:grid;place-items:center;font-size:40px}h1{margin:0 0 8px;font-size:30px}p{color:#a6b3c8;margin:0 0 34px}.button{display:block;padding:21px;margin:15px 0;border-radius:14px;text-decoration:none;color:#fff;font-weight:700;font-size:20px;background:#2563eb}.button.user{background:#243247}.button:focus-visible{outline:3px solid #fff;outline-offset:3px}footer{margin-top:36px;color:#94a3b8;font-size:12px}</style></head><body><main class="app"><div class="logo" aria-hidden="true">🌐</div><h1>Speedline</h1><p>Choose your account</p><a class="button" id="admin" href="https://sas.speedline-iq.com" target="_blank" rel="noopener noreferrer">Admin</a><a class="button user" id="user" href="https://speedline-iq.com" target="_blank" rel="noopener noreferrer">User</a><footer>Powered by Speedline</footer></main><script>async function loadLinks(){try{const r=await fetch('./links.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Failed');const links=await r.json();for(const key of ['admin','user']){const url=new URL(links[key]);if(url.protocol!=='https:')throw Error('Invalid URL');document.getElementById(key).href=url.href}}catch(e){console.warn('Using default links',e)}}loadLinks();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
