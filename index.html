<!doctype html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SPEEDWAY"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png"><title>SPEEDWAY Co.</title><style>

</style></head><body><main class="app"><img class="logo" src="speedway-logo.jpg" alt="SPEEDWAY logo"><h1>SPEEDWAY Co.</h1><p class="subtitle">IT &amp; Communications and ISP Ltd.</p><section class="entry"><a class="button" id="admin" href="https://sas.speedline-iq.com" target="_blank" rel="noopener noreferrer">Admin</a><p class="description">بۆ بریکارەکانمان کرتە لەسەر Admin بکە</p></section><section class="entry"><a class="button customer" id="customer" href="https://speedline-iq.com" target="_blank" rel="noopener noreferrer">Customer</a><p class="description">بۆ زانیاری دەربارەی هێڵەکەت یان پڕکردنەوەی هێڵەکەت کرتە لەسەر Customer بکە</p></section><footer>0750 857 2587</footer></main><script>
async function loadLinks(){try{const r=await fetch('./links.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Failed');const links=await r.json();for(const [id,key] of [['admin','admin'],['customer','customer']]){const value=links[key]||(key==='customer'?links.user:null);if(!value)continue;const url=new URL(value);if(url.protocol!=='https:')throw Error('Invalid URL');document.getElementById(id).href=url.href}}catch(e){console.warn('Using default links',e)}}loadLinks();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
